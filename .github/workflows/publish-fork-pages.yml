name: Publish fork demo to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: fork-pages
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'maxpatiiuk/lit.dev'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/configure-pages@v5
        id: pages
      - name: Require a root-level Pages URL
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          if [[ -n "$BASE_PATH" && "$BASE_PATH" != / ]]; then
            echo '::error::Configure a custom Pages domain; the site uses root-relative URLs.'
            exit 1
          fi
      - run: npm ci
      - run: npm run build:ts -w lit-dev-tools-cjs -w lit-dev-tools-esm
      - run: npm run prod:build -w lit-dev-content
        env:
          LITDEV_ENV: pages
          PAGES_ORIGIN: ${{ steps.pages.outputs.origin }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/lit-dev-content/_site
      - uses: actions/deploy-pages@v4
        id: deploy